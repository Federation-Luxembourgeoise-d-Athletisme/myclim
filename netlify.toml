[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# World Athletics proxy — keeps the same URL shape the frontend calls, backed
# by a Netlify Function (see netlify/functions/wa-athlete.mjs)
[[redirects]]
  from = "/api/wa/athlete/:waid/performances"
  to   = "/.netlify/functions/wa-athlete?waid=:waid"
  status = 200

[[redirects]]
  from = "/api/wa/athlete/:waid"
  to   = "/.netlify/functions/wa-athlete?waid=:waid"
  status = 200

# SPA fallback — must stay last
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
